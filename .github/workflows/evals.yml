# GitHub Actions job for evals. In your own project copy this file to .github/workflows/evals.yml
# and add OPENROUTER_API_KEY in Settings -> Secrets and variables -> Actions.
# It runs when a prompt, the testset or the RAG code changes, and fails the pull request
# if the metrics drop below baseline.json (TODO 7).
name: evals

on:
  pull_request:
    paths:
      - "prompts/**"
      - "evals/testset.json"
      - "rag.py"
      - "search.py"
      - "ingest.py"
      - "evals.py"
      - "baseline.json"

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evals and the gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python evals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/evals.json
